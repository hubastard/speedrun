# Runs the benchmark journey (bench/journey/journey.yaml) with speedrun on an Android emulator
# and an iOS simulator after every push to main: a regression check on Speedrun Bench, built
# from source each time. The JUnit report and speedrun's debug output are kept as artifacts.
name: Journey

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ODIN_VERSION: dev-2026-09

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bench/app/package-lock.json

      - name: Install Odin
        run: |
          curl -fsSL "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-linux-amd64-$ODIN_VERSION.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          dirname "$(find "$RUNNER_TEMP" -maxdepth 3 -name odin -type f | head -1)" >> "$GITHUB_PATH"

      - name: Build speedrun
        run: ./build.sh

      - name: Build Speedrun Bench (release)
        working-directory: bench/app
        run: |
          npm ci --no-audit --no-fund
          CI=1 npx expo prebuild --platform android
          (cd android && ./gradlew -q assembleRelease)

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the journey on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r bench/app/android/app/build/outputs/apk/release/app-release.apk
            ./speedrun test bench/journey/journey.yaml --format junit --output journey-android.xml --debug-output debug-android --flatten-debug-output

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-android
          path: |
            journey-android.xml
            debug-android
          if-no-files-found: ignore

  ios:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bench/app/package-lock.json

      - name: Install Odin
        run: |
          curl -fsSL "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-macos-arm64-$ODIN_VERSION.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          dirname "$(find "$RUNNER_TEMP" -maxdepth 3 -name odin -type f | head -1)" >> "$GITHUB_PATH"

      - name: Build speedrun and its iOS agent
        run: ./build.sh

      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in sorted(d, reverse=True) for x in d[r] if x["name"].startswith("iPhone") and "Pro" in x["name"]))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"

      - name: Build and install Speedrun Bench (release)
        working-directory: bench/app
        run: |
          npm ci --no-audit --no-fund
          DEVICE="$SIMULATOR" ./bench.sh build ios

      - name: Run the journey on the simulator
        run: ./speedrun test --device "$SIMULATOR" bench/journey/journey.yaml --format junit --output journey-ios.xml --debug-output debug-ios --flatten-debug-output

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-ios
          path: |
            journey-ios.xml
            debug-ios
          if-no-files-found: ignore
