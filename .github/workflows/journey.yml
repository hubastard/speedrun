# Runs the benchmark journey (bench/journey/journey.yaml) with speedrun on an Android emulator
# and an iOS simulator after every push to main: a regression check on Speedrun Bench, the
# prebuilt app for these sources (bench-app.yml publishes it), else built here. The JUnit
# report and speedrun's debug output are kept as artifacts.
name: Journey

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ODIN_VERSION: dev-2026-09

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Odin
        run: |
          curl -fsSL "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-linux-amd64-$ODIN_VERSION.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          dirname "$(find "$RUNNER_TEMP" -maxdepth 3 -name odin -type f | head -1)" >> "$GITHUB_PATH"

      - name: Build speedrun
        run: ./build.sh

      # Node only to build the app, when the release has none for these sources (setup-node
      # took 3-4 minutes on the macOS runner).
      - name: Get the prebuilt Speedrun Bench
        id: prebuilt
        continue-on-error: true
        working-directory: bench/app
        run: ./bench.sh fetch android

      - uses: actions/setup-node@v7
        if: steps.prebuilt.outcome == 'failure'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bench/app/package-lock.json

      - name: Build Speedrun Bench (no prebuilt app for these sources)
        if: steps.prebuilt.outcome == 'failure'
        working-directory: bench/app
        run: ./bench.sh compile android

      # The emulator action downloads the emulator once, and a corrupt download ("Error on
      # ZipFile unknown archive") failed a run before any test: installed here, retried, the
      # action finds it in place.
      - name: Install the Android emulator
        run: |
          sdkmanager=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          for i in 1 2 3; do
            "$sdkmanager" --install emulator --channel=0 > /dev/null && exit 0
            echo "sdkmanager failed (try $i of 3)"
            sleep 15
          done
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A phone's screen, as the journey expects (the emulator's default is 320x640: the
      # product page's options sit under its sticky footer and below the fold).
      # SPEEDRUN_DEBUG: every read, settle and drag in the log (CI's emulator is slower than
      # a local one).
      - name: Run the journey on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SPEEDRUN_DEBUG: 1
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          # The runner's 4 cores and more memory than the action's default (2 cores): CI's
          # software-rendered emulator was slow enough that a React Native list read blank
          # between drags, and scrollUntilVisible overshot its row.
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # A freshly booted emulator's launcher often stalls: "Pixel Launcher isn't
          # responding". With hide_error_dialogs, Android ends a stalled app instead of
          # asking; a dialog already up stays, so the launcher is ended too (it starts again).
          # speedrun answers the dialogs that still show.
          script: |
            adb shell wm size
            adb shell settings put global hide_error_dialogs 1
            adb shell 'am force-stop $(cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.HOME | tail -n 1 | cut -d/ -f1)'
            adb install -r bench/app/prebuilt/speedrun-bench.apk
            ./speedrun test bench/journey/journey.yaml --format junit --output journey-android.xml --debug-output debug-android --flatten-debug-output

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: journey-android
          path: |
            journey-android.xml
            debug-android
          if-no-files-found: ignore

  ios:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      # A simulator's first boot on a fresh runner takes minutes: it starts now, and boots
      # while speedrun and the app are fetched or built.
      - name: Start booting a simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in sorted(d, reverse=True) for x in d[r] if x["name"].startswith("iPhone") and "Pro" in x["name"]))')
          xcrun simctl boot "$udid"
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"

      - name: Install Odin
        run: |
          curl -fsSL "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-macos-arm64-$ODIN_VERSION.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          dirname "$(find "$RUNNER_TEMP" -maxdepth 3 -name odin -type f | head -1)" >> "$GITHUB_PATH"

      # iOS only: no Android agent, so no JDK or Gradle (5 minutes of the job).
      - name: Build speedrun and its iOS agent
        env:
          SPEEDRUN_NO_ANDROID: 1
        run: ./build.sh

      # Node only to build the app, when the release has none for these sources (setup-node
      # took 3-4 minutes on the macOS runner).
      - name: Get the prebuilt Speedrun Bench
        id: prebuilt
        continue-on-error: true
        working-directory: bench/app
        run: ./bench.sh fetch ios

      - uses: actions/setup-node@v7
        if: steps.prebuilt.outcome == 'failure'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bench/app/package-lock.json

      - name: Build Speedrun Bench (no prebuilt app for these sources)
        if: steps.prebuilt.outcome == 'failure'
        working-directory: bench/app
        run: ./bench.sh compile ios

      - name: Wait for the simulator, install the app
        timeout-minutes: 15
        run: |
          xcrun simctl bootstatus "$SIMULATOR" -b
          xcrun simctl install "$SIMULATOR" bench/app/prebuilt/SpeedrunBench.app

      # SPEEDRUN_DEBUG: every read, settle and hit test in the log (CI's simulator is slower
      # than a local one, and has shown races a local one rarely does).
      - name: Run the journey on the simulator
        env:
          SPEEDRUN_DEBUG: 1
        run: ./speedrun test --device "$SIMULATOR" bench/journey/journey.yaml --format junit --output journey-ios.xml --debug-output debug-ios --flatten-debug-output

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: journey-ios
          path: |
            journey-ios.xml
            debug-ios
          if-no-files-found: ignore
