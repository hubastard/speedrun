# Runs the benchmark journey (bench/journey/journey.yaml) with speedrun on an Android emulator
# and an iOS simulator after every push to main: a regression check on Speedrun Bench, the
# prebuilt app for these sources (the speedrun-bench repository's bench-app.yml publishes it),
# else built here. The benchmarks are the bench/ submodule (hubastard/speedrun-bench). On iOS, the
# simulator is booted with `speedrun fast-boot`, and a flow then clears the app's state. On the
# web, speedrun's web flows (dev/flows/web) and the Real World App's journeys (bench/web) run in
# Chrome and in Firefox. The JUnit reports and speedrun's debug output are kept as artifacts.
# After a push to main (not a run started by hand), the record job adds the runs' times to the
# bench-history branch, a row per push (bench/results.py ci), so a push that slowed a flow shows.
name: Journey

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: The platform to run the journey on
        type: choice
        options: [all, android, ios, web]
        default: all

# Read-only: these jobs only check out the code and keep artifacts.
permissions:
  contents: read

env:
  ODIN_VERSION: dev-2026-09

jobs:
  android:
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Odin
        run: |
          curl -fsSL "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-linux-amd64-$ODIN_VERSION.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          dirname "$(find "$RUNNER_TEMP" -maxdepth 3 -name odin -type f | head -1)" >> "$GITHUB_PATH"

      - name: Build speedrun
        run: ./build.sh

      # Node only to build the app, when the release has none for these sources (setup-node
      # took 3-4 minutes on the macOS runner).
      - name: Get the prebuilt Speedrun Bench
        id: prebuilt
        continue-on-error: true
        working-directory: bench/app
        run: ./bench.sh fetch android

      - uses: actions/setup-node@v7
        if: steps.prebuilt.outcome == 'failure'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bench/app/package-lock.json

      - name: Build Speedrun Bench (no prebuilt app for these sources)
        if: steps.prebuilt.outcome == 'failure'
        working-directory: bench/app
        run: ./bench.sh compile android

      # The emulator action downloads what it needs once, and a corrupt download ("Error on
      # ZipFile unknown archive": the emulator once, the system image once) failed runs before
      # any test: installed here, retried, the action finds them in place. The system image
      # matches the action's api-level, target and arch below.
      - name: Install the Android emulator and its system image
        run: |
          sdkmanager=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          for i in 1 2 3; do
            yes | "$sdkmanager" --install emulator --channel=0 platform-tools 'platforms;android-35' \
              'build-tools;37.0.0' 'system-images;android-35;google_apis;x86_64' > /dev/null && exit 0
            echo "sdkmanager failed (try $i of 3)"
            sleep 15
          done
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A phone's screen, as the journey expects (the emulator's default is 320x640: the
      # product page's options sit under its sticky footer and below the fold).
      # SPEEDRUN_DEBUG: every read, settle and drag in the log (CI's emulator is slower than
      # a local one).
      - name: Run the journey on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SPEEDRUN_DEBUG: 1
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          # The runner's 4 cores and more memory than the action's default (2 cores): CI's
          # software-rendered emulator was slow enough that a React Native list read blank
          # between drags, and scrollUntilVisible overshot its row.
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # A freshly booted emulator's launcher often stalls: "Pixel Launcher isn't
          # responding". With hide_error_dialogs, Android ends a stalled app instead of
          # asking; a dialog already up stays, so the launcher is ended too (it starts again).
          # speedrun answers the dialogs that still show.
          script: |
            adb shell wm size
            adb shell settings put global hide_error_dialogs 1
            adb shell 'am force-stop $(cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.HOME | tail -n 1 | cut -d/ -f1)'
            adb install -r bench/app/prebuilt/speedrun-bench.apk
            ./speedrun test bench/journey/journey.yaml --format junit --output journey-android.xml --debug-output debug-android --flatten-debug-output

      # What the record job needs to know about the run (bench/results.py ci-env).
      - name: Describe the run
        if: always()
        run: python3 bench/results.py ci-env bench-env.json --device "API 35 emulator (pixel_7, 4 cores, 4 GB)" --report journey-android.xml:journey:android:debug-android

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: journey-android
          path: |
            journey-android.xml
            debug-android
            bench-env.json
          if-no-files-found: ignore

  ios:
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install Odin
        run: |
          curl -fsSL "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-macos-arm64-$ODIN_VERSION.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          dirname "$(find "$RUNNER_TEMP" -maxdepth 3 -name odin -type f | head -1)" >> "$GITHUB_PATH"

      # A simulator's first boot on a fresh runner takes minutes, and the services it starts
      # keep it busy for minutes more: `speedrun fast-boot` boots it without them (and so is
      # tested on every push). It runs in the background while the iOS agent and the app are
      # built or fetched, from a speedrun built without its agent, in seconds.
      - name: Start fast-booting the simulator
        env:
          SPEEDRUN_NO_ANDROID: 1
          SPEEDRUN_NO_IOS: 1
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in sorted(d, reverse=True) for x in d[r] if x["name"].startswith("iPhone") and "Pro" in x["name"]))')
          ./build.sh
          cp speedrun "$RUNNER_TEMP/speedrun-boot"
          nohup sh -c '"$1" fast-boot --device "$2"; echo $? > "$3"' sh "$RUNNER_TEMP/speedrun-boot" "$udid" "$RUNNER_TEMP/boot.status" \
            > "$RUNNER_TEMP/boot.log" 2>&1 &
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"

      # iOS only: no Android agent, so no JDK or Gradle (5 minutes of the job).
      - name: Build speedrun and its iOS agent
        env:
          SPEEDRUN_NO_ANDROID: 1
        run: ./build.sh

      # Node only to build the app, when the release has none for these sources (setup-node
      # took 3-4 minutes on the macOS runner).
      - name: Get the prebuilt Speedrun Bench
        id: prebuilt
        continue-on-error: true
        working-directory: bench/app
        run: ./bench.sh fetch ios

      - uses: actions/setup-node@v7
        if: steps.prebuilt.outcome == 'failure'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bench/app/package-lock.json

      - name: Build Speedrun Bench (no prebuilt app for these sources)
        if: steps.prebuilt.outcome == 'failure'
        working-directory: bench/app
        run: ./bench.sh compile ios

      - name: Wait for the simulator, install the app
        timeout-minutes: 15
        run: |
          while [ ! -f "$RUNNER_TEMP/boot.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/boot.log"
          [ "$(cat "$RUNNER_TEMP/boot.status")" = 0 ]
          # fast-boot boots the simulator even when the services stay on: check they are off.
          grep -q "background services off, booted" "$RUNNER_TEMP/boot.log"
          xcrun simctl install "$SIMULATOR" bench/app/prebuilt/SpeedrunBench.app

      # SPEEDRUN_DEBUG: every read, settle and hit test in the log (CI's simulator is slower
      # than a local one, and has shown races a local one rarely does).
      - name: Run the journey on the simulator
        env:
          SPEEDRUN_DEBUG: 1
        run: ./speedrun test --device "$SIMULATOR" bench/journey/journey.yaml --format junit --output journey-ios.xml --debug-output debug-ios --flatten-debug-output

      # clearState on the app as the journey left it (signed in, a PIN set, a cart): the flow
      # checks the app starts over, and the step that its folders were emptied, not the app
      # reinstalled (which passes the flow too).
      - name: Clear the app's state
        shell: bash
        env:
          SPEEDRUN_DEBUG: 1
        run: |
          ./speedrun test --device "$SIMULATOR" bench/app/flows/sign_in.yaml --format junit --output sign-in-ios.xml --debug-output debug-ios --flatten-debug-output \
            | tee "$RUNNER_TEMP/sign-in.log"
          if grep "clear state: reinstalling" "$RUNNER_TEMP/sign-in.log"; then exit 1; fi

      - name: Describe the run
        if: always()
        run: python3 bench/results.py ci-env bench-env.json --simulator "$SIMULATOR" --report journey-ios.xml:journey:ios:debug-ios

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: journey-ios
          path: |
            journey-ios.xml
            sign-in-ios.xml
            debug-ios
            bench-env.json
          if-no-files-found: ignore

  web:
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'web'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Odin
        run: |
          curl -fsSL "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-linux-amd64-$ODIN_VERSION.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          dirname "$(find "$RUNNER_TEMP" -maxdepth 3 -name odin -type f | head -1)" >> "$GITHUB_PATH"

      # The web needs no device agent: no JDK or Gradle.
      - name: Build speedrun
        env:
          SPEEDRUN_NO_ANDROID: 1
        run: ./build.sh

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The app only: Playwright and Cypress are for the benchmark (bench-web.yml).
      - name: Set up the Real World App
        working-directory: bench/web
        run: |
          corepack enable
          ./setup.sh rwa

      - name: Serve the web test site and the Real World App
        run: |
          python3 -m http.server 8781 --bind 127.0.0.1 --directory dev/flows/web/site > "$RUNNER_TEMP/site.log" 2>&1 &
          (cd bench/web/rwa/app && nohup yarn start:ci > "$RUNNER_TEMP/rwa.log" 2>&1 &)
          for i in $(seq 180); do
            if curl -s -o /dev/null http://127.0.0.1:8781/ && curl -s -o /dev/null http://127.0.0.1:3001/ && curl -s -o /dev/null http://127.0.0.1:3000/; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/rwa.log"
          exit 1

      # Chrome's sandbox needs the user namespaces Ubuntu 23.10 and later keep from it: allowed
      # on this throwaway runner, so Chrome runs with it (speedrun would run it without, and say
      # so).
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Speedrun downloads each browser on its first run: Chrome for Testing's headless shell,
      # Mozilla's Firefox.
      - name: Run in Chrome
        run: |
          ./speedrun test --headless --device chromium dev/flows/web/ --format junit --output web-chrome.xml --debug-output debug-web-chrome --flatten-debug-output
          ./speedrun test --headless --device chromium --screen-size 1280x1000 bench/web/rwa/flows --format junit --output rwa-chrome.xml --debug-output debug-rwa-chrome --flatten-debug-output

      - name: Run in Firefox
        if: success() || failure()
        run: |
          ./speedrun test --headless --device firefox dev/flows/web/ --format junit --output web-firefox.xml --debug-output debug-web-firefox --flatten-debug-output
          ./speedrun test --headless --device firefox --screen-size 1280x1000 bench/web/rwa/flows --format junit --output rwa-firefox.xml --debug-output debug-rwa-firefox --flatten-debug-output

      - name: Describe the run
        if: always()
        run: |
          python3 bench/results.py ci-env bench-env.json --device "headless" \
            --report web-chrome.xml:web-site:chrome --report web-firefox.xml:web-site:firefox \
            --report rwa-chrome.xml:web-rwa:chrome --report rwa-firefox.xml:web-rwa:firefox

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: journey-web
          path: |
            web-*.xml
            rwa-*.xml
            debug-web-*
            debug-rwa-*
            bench-env.json
          if-no-files-found: ignore

  # After a push to main: the jobs' times go to the bench-history branch (bench/results.py ci),
  # whose README has a row per push and each benchmark's page its flows' or steps' times. A run
  # started by hand records nothing. One record at a time: each builds on the branch as the
  # previous one left it.
  record:
    needs: [android, ios, web]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: bench-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Record the runs on the bench-history branch
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin bench-history; then
            git worktree add -q history FETCH_HEAD
          else
            git worktree add -q --detach history
            git -C history checkout -q --orphan bench-history
            git -C history rm -rfq .
          fi
          python3 bench/results.py --history history/history.jsonl --out history \
            ci artifacts --commit "$GITHUB_SHA" --subject "${MESSAGE%%$'\n'*}"
          git -C history add -A
          if git -C history diff --cached --quiet; then exit 0; fi
          git -C history commit -q -m "Benchmarks of ${GITHUB_SHA::7}"
          git -C history push -q origin HEAD:bench-history
