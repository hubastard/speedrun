# Dependabot keeps the CI's actions and the Android agent's build current, and opens security
# updates for anything here with a known vulnerability. The benchmarks and their npm packages
# are the bench/ submodule (hubastard/speedrun-bench), a repository of its own that this one's
# alerts do not cover. The code built into speedrun (QuickJS-ng, stb_image, datafaker;
# NOTICE) is vendored, which Dependabot cannot see: watch their releases.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # One pull request for the agent's build tools: the Android Gradle plugin, Gradle and Kotlin
  # depend on each other's versions (Android Gradle plugin 9 needs Gradle 9).
  - package-ecosystem: gradle
    directory: /agent/android
    schedule:
      interval: monthly
    groups:
      agent-build:
        patterns: ['*']
