url: http://localhost:3000/signin
name: Like and comment on a transaction
---
- runFlow: shared/start.yaml
- runFlow: shared/sign_in.yaml
- tapOn: Mine
- tapOn:
    css: "[data-test^=transaction-item]"
- assertVisible: Transaction Detail
- tapOn:
    css: "[data-test^=transaction-like-button]"
- assertVisible:
    css: "[data-test^=transaction-like-count]"
    text: "2"
- tapOn:
    id: transaction-comment-input-.*
- inputText: Thank you!
- pressKey: Enter
- assertVisible: Thank you!
- tapOn:
    id: transaction-comment-input-.*
- inputText: Appreciate it.
- pressKey: Enter
- assertVisible: Appreciate it.
