url: http://localhost:3000/signin
name: Edit user settings
---
- runFlow: shared/start.yaml
- runFlow: shared/sign_in.yaml
- tapOn: My Account
- tapOn:
    id: user-settings-firstName-input
- eraseText
- inputText: New First Name
- tapOn:
    id: user-settings-lastName-input
- eraseText
- inputText: New Last Name
- tapOn:
    id: user-settings-email-input
- eraseText
- inputText: email@email.com
- tapOn:
    id: user-settings-phoneNumber-input
- eraseText
- inputText: "6155551212"
- tapOn: Save
- assertVisible: New First Name N
