url: http://localhost:3000/signin
name: Add a bank account
---
- runFlow: shared/start.yaml
- runFlow: shared/sign_in.yaml
- tapOn: Bank Accounts
- tapOn: Create
- tapOn:
    id: bankaccount-bankName-input
- inputText: The Best Bank
- tapOn:
    id: bankaccount-routingNumber-input
- inputText: "987654321"
- tapOn:
    id: bankaccount-accountNumber-input
- inputText: "123456789"
- tapOn: Save
- assertVisible: The Best Bank
