url: http://127.0.0.1:8791/
name: Add, complete, filter and clear todos
---
- launchApp
- tapOn: What needs to be done?
- inputText: Buy milk
- pressKey: Enter
- inputText: Walk the dog
- pressKey: Enter
- inputText: Write report
- pressKey: Enter
- inputText: Call mom
- pressKey: Enter
- inputText: Book flights
- pressKey: Enter
- tapOn:
    css: ".todo-list li:nth-child(2) .toggle"
# ".*": Maestro reads the count's text without its number ("<strong>4</strong> items left").
- assertVisible: ".*items left"
- tapOn: Active
- assertNotVisible: Walk the dog
- tapOn: Completed
- assertVisible: Walk the dog
- assertNotVisible: Buy milk
- tapOn: Clear completed
- tapOn: All
- assertVisible: ".*items left"
- assertNotVisible: Walk the dog
