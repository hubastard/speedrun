# Signs in after a launch with clearState and clearKeychain (so no "Welcome back": see
# remember_me.yaml). Env: PHONE, CODE, REMEMBER (true/false).
appId: dev.speedrun.bench
---
# The first launch after clearState shows the onboarding.
- tapOn:
    id: onboarding-skip
- tapOn:
    id: phone-input
- inputText: ${PHONE}
- runFlow:
    when:
      true: ${REMEMBER == 'true'}
    commands:
      - tapOn:
          id: remember-me
- tapOn:
    id: next
- extendedWaitUntil:
    visible:
      id: code-input
    timeout: 10000
- inputText: ${CODE}
# Home, or the notification prompt over it (iOS leaves what a popup covers out of the
# accessibility tree): either means the sign in is done.
- extendedWaitUntil:
    visible:
      id: "tab-home|notify-title"
    timeout: 15000
- runFlow: dismiss-notify.yaml
- extendedWaitUntil:
    visible: "Hi, .*"
    timeout: 10000
