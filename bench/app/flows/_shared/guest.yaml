# A fresh start as a guest: onboarding skipped, no sign in. The keychain is cleared too: iOS
# keeps a remembered account across clearState ("Welcome back"; remember_me.yaml tests it).
appId: dev.speedrun.bench
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn:
    id: onboarding-skip
- tapOn:
    id: guest
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 10000
