appId: dev.speedrun.bench
name: Popups that come one after another (native modals, a sheet)
tags: [lab, popups]
---
- runFlow: _shared/guest.yaml
- tapOn:
    id: tab-lab
- tapOn:
    id: lab-popups-first
- runFlow: _shared/dismiss-order-popups.yaml
- assertNotVisible:
    id: badge-title
- tapOn:
    id: lab-popups-second
- runFlow: _shared/dismiss-order-popups.yaml
- assertNotVisible:
    id: survey-title
- assertVisible:
    id: lab-device
# Checks for popups that do not show wait 7 s in all, counted from the last command that may
# have changed the app (evalScript is one). A file of checks that touched nothing is not:
# the check after it reads the screen once instead of waiting 7 s again (14 s in all).
- evalScript: ${output.checksFrom = Date.now()}
- runFlow: _shared/dismiss-promos.yaml
- runFlow: _shared/dismiss-notify.yaml
- assertTrue: ${Date.now() - output.checksFrom < 12000}
