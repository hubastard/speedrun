appId: dev.speedrun.bench
name: Sign in with a phone number and a code, a wrong one first
tags: [auth]
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn:
    id: onboarding-skip
- assertVisible:
    id: next
    enabled: false
- tapOn:
    id: phone-input
- inputText: "5550101234"
- assertVisible: "\\(555\\) 010-1234"
- assertVisible:
    id: next
    enabled: true
- eraseText: 4
- assertVisible: "\\(555\\) 010"
- inputText: "1234"
- tapOn:
    id: next
- extendedWaitUntil:
    visible: "Sent to \\(555\\) 010-1234"
    timeout: 10000
- tapOn:
    id: code-input
- inputText: "111111"
- extendedWaitUntil:
    visible: "Wrong code, try again"
    timeout: 5000
- tapOn:
    id: code-input
- inputText: "123456"
- extendedWaitUntil:
    visible:
      id: "tab-home|notify-title"
    timeout: 15000
# The app's prompt, then iOS's own alert (Android: launchApp granted the permission, so no
# dialog comes).
- runFlow:
    when:
      visible:
        id: notify-title
    commands:
      - tapOn:
          id: notify-on
      - runFlow:
          when:
            platform: iOS
          commands:
            - runFlow:
                when:
                  visible: "Allow"
                commands:
                  - tapOn: "Allow"
- assertVisible: "Hi, Alex"
