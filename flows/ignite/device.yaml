# Device commands on iOS with Ignite's demo app (apps/ignite, see README.md): launch
# arguments, permissions, dark mode, screenshots, recording, media, location, random input
# and hideKeyboard. Runs as is in Maestro too: DEVICE=<udid> ./compare.sh flows/ignite/device.yaml
appId: com.speedrun.ignitedemo
---
- launchApp:
    clearState: true
    arguments:
      isE2E: true
      user: "test user"
- setPermissions:
    permissions:
      all: deny
      camera: allow
      location: inuse
- setDarkMode: enabled
- assertDarkMode
- toggleDarkMode
- assertLightMode
- takeScreenshot:
    path: login_button
    cropOn: "Tap to log in!"
- assertScreenshot:
    path: login_button
    cropOn: "Tap to log in!"
- startRecording: login
- tapOn: "Tap to log in!"
- stopRecording
- addMedia:
    - ../device/pic.png
- setLocation:
    latitude: 48.8584
    longitude: 2.2945
- travel:
    points:
      - 48.8584,2.2945
      - 48.8600,2.3000
    speed: 100
- tapOn:
    text: "Let's go!"
    waitUntilVisible: true
- tapOn: "Components.*"
- scrollUntilVisible:
    element:
      text: "No Status, This is the default status"
    direction: DOWN
    centerElement: true
- tapOn: "No Status, This is the default status"
- inputRandomPersonName
- eraseText
- inputText: ${faker.address().city()}
- hideKeyboard
- assertNotVisible:
    id: delete
