# Benchmark flow, run as-is by both tools. It starts Settings app fresh (launchApp):
#
# Iterations come from TIMES (1 when not given):
#   ./compare.sh bench_scenario.yaml          (both tools, side by side)
#   ./speedrun --flow bench_scenario.yaml     (speedrun)
#   maestro test bench_scenario.yaml          (Maestro)

appId: com.android.settings
env:
  TIMES: ${TIMES || 1}
---
- launchApp
- repeat:
    times: ${TIMES}
    commands:
      - tapOn: "Display & touch"
      - tapOn: "Display size & text"
      - assertVisible: "Bold text"
      - back
      - back
      - scrollUntilVisible:
          element:
            text: "About emulated device"
          direction: DOWN
      - tapOn: "About emulated device"
      - tapOn: "Device name"
      - eraseText: 25
      - inputText: "Speedrun bench"
      - assertVisible: "Speedrun bench"
      - tapOn: "Cancel"
      - back
      - scrollUntilVisible:
          element:
            text: "Network & internet"
          direction: UP
