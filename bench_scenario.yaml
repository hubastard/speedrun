# Benchmark flow, run as-is by both tools. Start on the Settings home screen, scrolled to
# the top. Iterations come from TIMES:
#   ./compare.sh bench_scenario.yaml -e TIMES=5        (both tools, side by side)
#   ./run.sh --flow bench_scenario.yaml -e TIMES=5     (this tool)
#   maestro test -e TIMES=5 bench_scenario.yaml        (Maestro)
appId: com.android.settings
---
- repeat:
    times: ${TIMES}
    commands:
      # Navigation, two levels deep and back.
      - tapOn: "Display & touch"
      - tapOn: "Display size & text"
      - assertVisible: "Bold text"
      - back
      - back
      # Scrolling, then text input in a dialog. Cancel keeps the device name unchanged.
      - scrollUntilVisible:
          element:
            text: "About emulated device"
          direction: DOWN
      - tapOn: "About emulated device"
      - tapOn: "Device name"
      - eraseText: 25
      - inputText: "Spike bench"
      - assertVisible: "Spike bench"
      - tapOn: "Cancel"
      - back
      - scrollUntilVisible:
          element:
            text: "Network & internet"
          direction: UP
